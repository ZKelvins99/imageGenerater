name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install deps
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt

      - name: Ruff check
        run: .venv/bin/ruff check app tests

      - name: Ruff format
        run: .venv/bin/ruff format --check app tests

      - name: Mypy
        run: .venv/bin/mypy app

      - name: Pytest
        run: .venv/bin/pytest -q

  package-windows:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install desktop deps
        run: |
          uv venv --python 3.12
          .\.venv\Scripts\python.exe -m pip install -r requirements-desktop.txt pyinstaller

      - name: Build one-dir bundle
        run: .\.venv\Scripts\pyinstaller.exe --clean --noconfirm desktop.spec

      - name: Build installer (NSIS)
        uses: joncloud/makensis-action@v4
        with:
          script-file: installer\installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImageGenerater-Setup
          path: dist\ImageGenerater-Setup.exe
          if-no-files-found: error
